name: Recuperer le site en ligne
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  recup:
    if: ${{ !contains(github.event.head_commit.message, '[site]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f index.html && exit 0
          curl -sf -o index.html https://mission-3ans.vercel.app/index.html
          curl -sf -o liste.html https://mission-3ans.vercel.app/liste.html
          git config user.name "EL TSHI DIGIT"; git config user.email "actions@github.com"
          git add index.html liste.html && git commit -m "[site] Version en ligne recuperee" && git push
